name: Release book

# Rebuild the compiled Sphinx HTML and publish it to the release-book branch
# whenever a BobcatRelease branch is pushed (branch creation is the first push).
# The release-book branch is excluded so this doesn't loop on its own output.

on:
  push:
    branches:
      - 'release-*'
      - '!release-book'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-book
  cancel-in-progress: false

jobs:
  build:
    name: Build book and publish to release-book
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sphinx
        run: pip install sphinx

      - name: Build HTML
        run: make html
        working-directory: book

      - name: Publish to release-book
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/_build/html
          publish_branch: release-book
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'