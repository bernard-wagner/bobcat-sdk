name: Release book

# Rebuild the compiled Sphinx HTML and deploy it with GitHub Pages whenever a
# BobcatRelease branch is pushed (branch creation is the first push).

on:
  push:
    branches:
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sphinx
        run: pip install sphinx

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build HTML
        run: make html
        working-directory: book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/_build/html

  deploy:
    name: Deploy book to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
