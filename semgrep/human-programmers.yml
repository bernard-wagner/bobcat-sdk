rules:
  - id: bobcat-use-u-is-zero
    languages: [rust]
    severity: ERROR
    message: >-
      Do not compare U with U::ZERO. Use value.is_zero() instead; it is clearer
      and uses U's dedicated zero test.
    metadata:
      audience: human-programmers
      category: idiom
      technology: [rust, bobcat-maths]
    pattern-either:
      - pattern: $VALUE == U::ZERO
      - pattern: U::ZERO == $VALUE
      - pattern: $VALUE == $PATH::U::ZERO
      - pattern: $PATH::U::ZERO == $VALUE

  - id: bobcat-use-u-is-some
    languages: [rust]
    severity: ERROR
    message: >-
      Do not compare U with U::ZERO. Use value.is_some() instead; it is clearer
      and uses U's dedicated nonzero test.
    metadata:
      audience: human-programmers
      category: idiom
      technology: [rust, bobcat-maths]
    pattern-either:
      - pattern: $VALUE != U::ZERO
      - pattern: U::ZERO != $VALUE
      - pattern: $VALUE != $PATH::U::ZERO
      - pattern: $PATH::U::ZERO != $VALUE
